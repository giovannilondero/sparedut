# Checks every pull request; on main it also deploys to Cloudflare with Alchemy.
# The deploy needs, in the repository settings:
#   secret CLOUDFLARE_API_TOKEN, variable CLOUDFLARE_ACCOUNT_ID
#   variable DEPLOY_DOMAIN, the domain (without it, no deploy: forks stay quiet)
# and a first `pnpm cf:deploy` from your own computer, which installs Alchemy's state in the account.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces the check; a deploy always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_DOMAIN != ''
        run: pnpm cf:deploy --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
