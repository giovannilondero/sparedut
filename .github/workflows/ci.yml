# Checks every pull request; on main it also deploys to Cloudflare with Alchemy, then tags the
# deployed commit `vX.Y.Z` (`version` in package.json) and publishes a GitHub Release for it.
# The deploy needs, in the repository settings:
#   secret CLOUDFLARE_API_TOKEN, variable CLOUDFLARE_ACCOUNT_ID
#   variable DEPLOY_DOMAIN, the domain (without it, no deploy: forks stay quiet)
# and a first `pnpm cf:deploy` from your own computer, which installs Alchemy's state in the account.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces the check; a deploy always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # Over the build output, so after the build: the service worker's precache list.
      - run: pnpm test:build
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_DOMAIN != ''
        run: pnpm cf:deploy --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}

  # After a successful deploy: the tag `vX.Y.Z` on the deployed commit and a GitHub Release with
  # generated notes. A merge that did not bump the version finds its tag already there and stops,
  # without failing. Its own job, so only this one can write to the repository.
  release:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_DOMAIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Tag and release the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version package.json)"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag is already tagged: this merge did not bump the version, nothing to release."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
