<!doctype html>
<html lang="fur" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14110f" />
    <title>Sparedût</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <!-- Schermata di caricamento: stili in linea, così si vede prima del CSS e del bundle. -->
    <style>
      .booting #menu, .booting #hud { visibility: hidden; }
      #loader { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: radial-gradient(120% 90% at 50% 40%, #241d17 0%, #14110f 70%); color: #f3e9d2;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; transition: opacity 0.45s ease-out; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .l-title { font-size: clamp(48px, 9vw, 104px); font-weight: 700; letter-spacing: 0.04em; line-height: 1;
        background: linear-gradient(180deg, #fff3cf 0%, #e8b64c 55%, #a8761f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #loader .l-bar { inline-size: min(260px, 60vw); block-size: 3px; border-radius: 2px; background: rgba(232, 182, 76, 0.18); overflow: clip; }
      #loader .l-bar i { display: block; inline-size: 35%; block-size: 100%; background: #e8b64c; border-radius: 2px; }
      #loader .l-text { font-style: italic; font-size: 16px; color: #b9a988; }
      @media (prefers-reduced-motion: no-preference) {
        #loader .l-bar i { animation: l-run 1.1s ease-in-out infinite alternate; }
        #loader .l-title { animation: l-breathe 2.4s ease-in-out infinite; }
      }
      @keyframes l-run { from { transform: translateX(-10%); } to { transform: translateX(195%); } }
      @keyframes l-breathe { 50% { opacity: 0.75; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="l-title">Sparedût</div>
      <div class="l-bar"><i></i></div>
      <div class="l-text" id="loader-text">Si cjarie il Dom di Glemone…</div>
    </div>
    <script>
      // Prima del bundle: il testo nella lingua scelta l'ultima volta.
      try {
        if (JSON.parse(localStorage.getItem("sparedut.settings") || "{}").lang === "it")
          document.getElementById("loader-text").textContent = "Si carica il Duomo di Gemona…"
      } catch {}
      // Se il bundle si rompe all'avvio, lo si dice invece di caricare per sempre.
      addEventListener("error", () => {
        const text = document.getElementById("loader-text")
        if (text) text.textContent = "Alc al è lât strucj · Qualcosa è andato storto: ricarica la pagina"
      }, { once: true })
    </script>
    <canvas id="view"></canvas>

    <!-- ===================== MENU ===================== -->
    <div id="menu" class="screen">
      <div class="menu-shade"></div>
      <header class="brand">
        <div class="brand-kicker" data-t="kicker"></div>
        <h1 class="brand-title">Sparedût</h1>
        <div class="brand-sub" data-t="sub"></div>
        <div class="lang" role="group"><span data-t="language"></span><button data-lang="fur">Furlan</button><button data-lang="it">Italiano</button></div>
      </header>

      <nav id="menu-home" class="panel home">
        <label class="field name-field">
          <span data-t="nameLabel"></span>
          <input id="name" maxlength="20" data-t-ph="namePh" autocomplete="off" />
        </label>
        <button class="big primary" data-go="quick">
          <span data-t="quick"></span><small data-t="quickSub"></small>
        </button>
        <button class="big" data-go="create">
          <span data-t="create"></span><small data-t="createSub"></small>
        </button>
        <button class="big" data-go="join">
          <span data-t="join"></span><small data-t="joinSub"></small>
        </button>
        <div class="lan-box">
          <div class="lan-title" data-t="lanTitle"></div>
          <ul id="lan-list"></ul>
        </div>
        <div class="row small-buttons">
          <button data-go="armarie" data-t="armarie"></button>
          <button data-go="settings" data-t="settings"></button>
          <button data-go="vocabolari" data-t="vocab"></button>
        </div>
      </nav>

      <section id="menu-create" class="panel hidden">
        <h2 data-t="create"></h2>
        <div id="mode-cards" class="cards"></div>
        <div class="grid2">
          <label class="field"><span data-t="minutesLabel"></span><select id="c-minutes"></select></label>
          <label class="field"><span data-t="botsLabel"></span><select id="c-bots"></select></label>
        </div>
        <div class="field"><span data-t="levelLabel"></span><div id="c-level" class="levels" role="radiogroup"></div></div>
        <label class="field"><span data-t="visLabel"></span><select id="c-vis"><option value="lan" data-t="visLan"></option><option value="code" data-t="visCode"></option></select></label>
        <label class="check"><input type="checkbox" id="c-ff" /> <span data-t="ff"></span></label>
        <div class="row">
          <button data-go="home" data-t="back"></button>
          <button class="primary" id="c-go" data-t="createGo"></button>
        </div>
      </section>

      <section id="menu-join" class="panel hidden">
        <h2 data-t="join"></h2>
        <input id="j-code" class="code-input" maxlength="4" placeholder="ABCD" autocomplete="off" />
        <div class="row">
          <button data-go="home" data-t="back"></button>
          <button class="primary" id="j-go" data-t="joinGo"></button>
        </div>
      </section>

      <section id="menu-armarie" class="panel wide hidden">
        <h2 data-t="armarieTitle"></h2>
        <div id="armarie" class="weapons"></div>
        <div class="row"><button data-go="home" data-t="back"></button></div>
      </section>

      <section id="menu-settings" class="panel hidden">
        <h2 data-t="settings"></h2>
        <label class="field"><span><span data-t="sens"></span> <b id="s-sens-v"></b></span><input type="range" id="s-sens" min="0.2" max="3" step="0.05" /></label>
        <label class="field"><span><span data-t="fov"></span> <b id="s-fov-v"></b></span><input type="range" id="s-fov" min="65" max="105" step="1" /></label>
        <label class="field"><span><span data-t="volume"></span> <b id="s-master-v"></b></span><input type="range" id="s-master" min="0" max="1" step="0.05" /></label>
        <label class="field"><span><span data-t="music"></span> <b id="s-music-v"></b></span><input type="range" id="s-music" min="0" max="1" step="0.05" /></label>
        <label class="field"><span data-t="quality"></span><select id="s-quality"><option value="bassa" data-t="qLow"></option><option value="media" data-t="qMid"></option><option value="alta" data-t="qHigh"></option></select></label>
        <label class="check"><input type="checkbox" id="s-autores" /> <span data-t="autoRes"></span></label>
        <label class="check"><input type="checkbox" id="s-info" /> <span data-t="showInfo"></span></label>
        <label class="check"><input type="checkbox" id="s-invert" /> <span data-t="invert"></span></label>
        <div class="keys" data-t="keys"></div>
        <div class="row"><button data-go="home" data-t="back"></button></div>
      </section>

      <section id="menu-vocabolari" class="panel wide hidden">
        <h2 data-t="vocabTitle"></h2>
        <div id="vocabolari" class="vocab"></div>
        <div class="row"><button data-go="home" data-t="back"></button></div>
      </section>

      <footer class="menu-foot">
        <div id="tip" class="tip"></div>
        <div class="status" id="status" data-t="connecting"></div>
      </footer>
    </div>

    <!-- ===================== HUD ===================== -->
    <div id="hud" class="hidden">
      <div id="scope" class="hidden"><div class="scope-cross"></div></div>
      <div id="sgnape-fx"></div>
      <div id="damage-flash"></div>
      <div id="dmg-dirs"></div>
      <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
      <div id="hitmarker"></div>

      <div id="topbar">
        <div class="score ben"><span class="team-name" id="name-ben"></span><b id="score-ben">0</b></div>
        <div class="center-info">
          <div id="clock">10:00</div>
          <div id="mode-label"></div>
          <div id="objective"></div>
        </div>
        <div class="score mal"><b id="score-mal">0</b><span class="team-name" id="name-mal"></span></div>
      </div>

      <div id="killfeed"></div>
      <div id="announce"></div>
      <div id="banner"></div>

      <div id="vitals">
        <div class="vital hp"><span class="ico">🧀</span><b id="hp">100</b><div class="bar"><i id="hp-bar"></i></div></div>
        <div class="vital armor"><span class="ico">🥮</span><b id="armor">0</b><div class="bar"><i id="armor-bar"></i></div></div>
        <div id="buffs"></div>
      </div>

      <div id="ammo">
        <div id="weapon-name"></div>
        <div class="ammo-row"><b id="mag">30</b><span>/</span><span id="reserve">150</span></div>
        <div id="bombs"></div>
        <div id="slots"></div>
      </div>

      <div id="chat"><div id="chat-log"></div><input id="chat-input" class="hidden" maxlength="120" data-t-ph="chatPh" /></div>
      <div id="quickchat" class="hidden"></div>

      <div id="death" class="hidden">
        <div class="death-title" data-t="deathTitle"></div>
        <div id="death-by"></div>
        <div id="death-line"></div>
        <div id="death-timer"></div>
        <div class="death-hint" data-t="deathHint"></div>
      </div>

      <div id="board" class="hidden"></div>
      <div id="loadout" class="hidden overlay"></div>
      <div id="pause" class="hidden overlay"></div>
      <div id="endscreen" class="hidden overlay"></div>
      <div id="clickplay" class="hidden" data-t="clickplay"></div>
    </div>

    <div id="toast" class="hidden"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
