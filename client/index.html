<!doctype html>
<html lang="fur" class="booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14110f" />
    <title>Sparedût</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <!-- Loading screen: inline styles, so it shows before the CSS and the bundle. -->
    <style>
      .booting #menu, .booting #hud { visibility: hidden; }
      #loader { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 18px;
        background: radial-gradient(120% 90% at 50% 40%, #241d17 0%, #14110f 70%); color: #f3e9d2;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; transition: opacity 0.45s ease-out; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .l-title { font-size: clamp(48px, 9vw, 104px); font-weight: 700; letter-spacing: 0.04em; line-height: 1;
        background: linear-gradient(180deg, #fff3cf 0%, #e8b64c 55%, #a8761f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #loader .l-bar { inline-size: min(260px, 60vw); block-size: 3px; border-radius: 2px; background: rgba(232, 182, 76, 0.18); overflow: clip; }
      #loader .l-bar i { display: block; inline-size: 35%; block-size: 100%; background: #e8b64c; border-radius: 2px; }
      #loader .l-text { font-style: italic; font-size: 16px; color: #b9a988; }
      @media (prefers-reduced-motion: no-preference) {
        #loader .l-bar i { animation: l-run 1.1s ease-in-out infinite alternate; }
        #loader .l-title { animation: l-breathe 2.4s ease-in-out infinite; }
      }
      @keyframes l-run { from { transform: translateX(-10%); } to { transform: translateX(195%); } }
      @keyframes l-breathe { 50% { opacity: 0.75; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="l-title">Sparedût</div>
      <div class="l-bar"><i></i></div>
      <div class="l-text" id="loader-text">Si cjarie il Dom di Glemone…</div>
    </div>
    <script src="/boot.js"></script>
    <canvas id="view"></canvas>

    <!-- ===================== MENU ===================== -->
    <div id="menu">
      <header class="brand">
        <h1 class="brand-title">Sparedût</h1>
        <!-- The look the world is drawn in: chosen here only, never shown over a match. Its buttons are built by Menu.bindLook (client/menu.ts). -->
        <div id="look-switch" class="look-switch" role="group" aria-labelledby="look-label"><span id="look-label"></span></div>
        <div class="lang" role="group" aria-labelledby="lang-label"><span id="lang-label" data-t="language"></span><button data-lang="fur">Furlan</button><button data-lang="it">Italiano</button></div>
      </header>

      <!-- Home: everything at once, the room list beside the actions when there is room for it. -->
      <div id="menu-home" class="home">
        <label class="field home-name">
          <span data-t="nameLabel"></span>
          <input id="name" maxlength="20" data-t-ph="namePh" autocomplete="off" autocapitalize="words" spellcheck="false" />
        </label>
        <button class="big primary home-hero" data-go="one-tap">
          <span data-t="oneTap"></span><small class="sub" data-t="oneTapSub"></small><small class="last" id="one-tap-last"></small>
        </button>
        <div class="home-tiles">
          <button class="big home-tile" data-go="create">
            <span data-t="create"></span><small data-t="createSub"></small>
          </button>
          <form id="j-form" class="home-tile code-join" novalidate>
            <label for="j-code" data-t="join"></label>
            <input id="j-code" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="j-msg" />
            <button id="j-go" data-t="joinGo"></button>
            <p id="j-msg" class="form-msg" role="alert"></p>
          </form>
          <!-- The training's place: its entry goes here once the training exists. Nothing is shown or focusable until then. -->
          <div class="home-training" hidden></div>
        </div>
        <section class="home-rooms" aria-labelledby="rooms-title">
          <h2 id="rooms-title" data-t="roomsTitle"></h2>
          <div id="room-list"></div>
        </section>
        <nav class="home-tools">
          <button data-go="armarie" data-t="armarie"></button>
          <button data-go="settings" data-t="settings"></button>
          <button data-go="vocabolari" data-t="vocab"></button>
        </nav>
      </div>

      <!-- A password room's prompt, over the home screen: the room list stays where it was. -->
      <ui-dialog id="pw-dialog">
        <ui-dialog-backdrop class="pw-scrim" hidden></ui-dialog-backdrop>
        <ui-dialog-content class="pw-dialog" initial-focus="#pw-input" hidden>
          <ui-dialog-title><span aria-hidden="true">🔒</span> <span data-t="passwordTitle"></span></ui-dialog-title>
          <ui-dialog-description id="pw-for"></ui-dialog-description>
          <ul id="pw-room" class="rooms pw-room"></ul>
          <form id="pw-form" class="pw-form" novalidate>
            <label class="field"><span data-t="passwordLabel"></span><input id="pw-input" class="pw-input" maxlength="32" autocomplete="off" spellcheck="false" aria-describedby="pw-msg" /></label>
            <p id="pw-msg" class="form-msg" role="alert"></p>
            <div class="pw-buttons">
              <ui-dialog-close><button type="button" data-t="back"></button></ui-dialog-close>
              <button class="primary" data-t="joinGo"></button>
            </div>
          </form>
        </ui-dialog-content>
      </ui-dialog>

      <!-- Creation on one page: mode and map in front, the rest folded under "options", whose bar sums them up. -->
      <section id="menu-create" class="create hidden" aria-labelledby="c-title">
        <header class="create-head">
          <button data-go="home" data-t="back"></button>
          <h2 id="c-title" data-t="create"></h2>
        </header>
        <div class="create-pick">
          <section class="create-sec">
            <h3 id="c-mode-label" data-t="modeLabel"></h3>
            <ui-radio-group id="c-mode" class="create-cards" aria-labelledby="c-mode-label" aria-describedby="c-rules"></ui-radio-group>
            <p id="c-rules" class="create-rules"></p>
          </section>
          <section class="create-sec">
            <h3 id="c-map-label" data-t="mapLabel"></h3>
            <ui-radio-group id="c-map" class="create-cards" aria-labelledby="c-map-label"></ui-radio-group>
          </section>
        </div>
        <ui-collapsible id="c-options" class="create-options">
          <ui-collapsible-trigger><button type="button" class="create-fold">
            <span><b data-t="optionsLabel"></b><small id="c-summary"></small></span><i aria-hidden="true">▾</i>
          </button></ui-collapsible-trigger>
          <ui-collapsible-panel class="create-opts" keep-mounted hidden>
            <div class="field">
              <ui-select id="c-minutes" class="create-select" presentation="auto">
                <ui-select-label data-t="minutesLabel"></ui-select-label>
                <ui-select-trigger><button type="button"><ui-select-value></ui-select-value></button></ui-select-trigger>
                <ui-select-content class="create-list"></ui-select-content>
              </ui-select>
            </div>
            <div class="field">
              <ui-select id="c-bots" class="create-select" presentation="auto">
                <ui-select-label data-t="botsLabel"></ui-select-label>
                <ui-select-trigger><button type="button"><ui-select-value></ui-select-value></button></ui-select-trigger>
                <ui-select-content class="create-list"></ui-select-content>
              </ui-select>
            </div>
            <div class="field create-wide"><span id="c-level-label" data-t="levelLabel"></span><ui-radio-group id="c-level" class="create-cards" aria-labelledby="c-level-label"></ui-radio-group></div>
            <div class="field create-wide"><span id="c-reach-label" data-t="reachLabel"></span><ui-radio-group id="c-reach" class="create-cards create-reaches" aria-labelledby="c-reach-label"></ui-radio-group></div>
            <div class="create-wide create-access" id="c-access-field">
              <div class="field"><span id="c-access-label" data-t="accessLabel"></span><ui-radio-group id="c-access" class="create-cards create-accesses" aria-labelledby="c-access-label"></ui-radio-group></div>
              <label class="field" id="c-password-field" hidden><span data-t="passwordLabel"></span><input id="c-password" maxlength="32" autocomplete="off" spellcheck="false" aria-describedby="c-msg" /></label>
            </div>
            <label class="check create-wide"><input type="checkbox" id="c-ff" /> <span data-t="ff"></span></label>
          </ui-collapsible-panel>
        </ui-collapsible>
        <footer class="create-go">
          <p id="c-msg" class="form-msg" role="alert"></p>
          <button class="primary" id="c-go" data-t="createGo"></button>
        </footer>
      </section>

      <section id="menu-armarie" class="panel wide hidden">
        <h2 data-t="armarieTitle"></h2>
        <div id="armarie" class="weapons"></div>
        <div class="row screen-foot"><button data-go="home" data-t="back"></button></div>
      </section>

      <section id="menu-settings" class="panel hidden">
        <h2 data-t="settings"></h2>
        <!-- The form moves into the match menu when it is opened from there. -->
        <div id="settings-home"><div id="settings-form" class="settings-form">
          <ui-field class="s-range"><ui-slider id="s-sens" min="0.2" max="3" step="0.05">
            <div class="s-range-head"><ui-field-label data-t="sens"></ui-field-label><ui-slider-value></ui-slider-value></div>
            <ui-slider-control><ui-slider-track><ui-slider-indicator></ui-slider-indicator><ui-slider-thumb></ui-slider-thumb></ui-slider-track></ui-slider-control>
          </ui-slider></ui-field>
          <ui-field class="s-range"><ui-slider id="s-fov" min="65" max="105" step="1">
            <div class="s-range-head"><ui-field-label data-t="fov"></ui-field-label><ui-slider-value></ui-slider-value></div>
            <ui-slider-control><ui-slider-track><ui-slider-indicator></ui-slider-indicator><ui-slider-thumb></ui-slider-thumb></ui-slider-track></ui-slider-control>
          </ui-slider></ui-field>
          <ui-field class="s-range"><ui-slider id="s-master" min="0" max="1" step="0.05">
            <div class="s-range-head"><ui-field-label data-t="volume"></ui-field-label><ui-slider-value></ui-slider-value></div>
            <ui-slider-control><ui-slider-track><ui-slider-indicator></ui-slider-indicator><ui-slider-thumb></ui-slider-thumb></ui-slider-track></ui-slider-control>
          </ui-slider></ui-field>
          <ui-field class="s-range"><ui-slider id="s-music" min="0" max="1" step="0.05">
            <div class="s-range-head"><ui-field-label data-t="music"></ui-field-label><ui-slider-value></ui-slider-value></div>
            <ui-slider-control><ui-slider-track><ui-slider-indicator></ui-slider-indicator><ui-slider-thumb></ui-slider-thumb></ui-slider-track></ui-slider-control>
          </ui-slider></ui-field>
          <label class="field"><span data-t="quality"></span><select id="s-quality"><option value="bassa" data-t="qLow"></option><option value="media" data-t="qMid"></option><option value="alta" data-t="qHigh"></option></select></label>
          <label class="s-switch"><span data-t="autoRes"></span><ui-switch id="s-autores"><ui-switch-thumb></ui-switch-thumb></ui-switch></label>
          <label class="s-switch"><span data-t="showInfo"></span><ui-switch id="s-info"><ui-switch-thumb></ui-switch-thumb></ui-switch></label>
          <label class="s-switch"><span data-t="invert"></span><ui-switch id="s-invert"><ui-switch-thumb></ui-switch-thumb></ui-switch></label>
          <label class="field"><span data-t="crouchMode"></span><select id="s-crouch"><option value="hold" data-t="crouchHold"></option><option value="toggle" data-t="crouchToggle"></option></select></label>
          <div class="keys" data-t="keys"></div>
        </div></div>
        <div class="row screen-foot"><button data-go="home" data-t="back"></button></div>
      </section>

      <section id="menu-vocabolari" class="panel wide hidden">
        <h2 id="vocab-title" data-t="vocabTitle" tabindex="-1"></h2>
        <div id="vocabolari" class="vocab"></div>
        <div class="row screen-foot"><button data-go="home" data-t="back"></button></div>
      </section>

      <footer class="menu-foot">
        <div id="tip" class="tip"></div>
        <div class="status" id="status" data-t="connecting"></div>
      </footer>
    </div>

    <!-- ===================== HUD ===================== -->
    <div id="hud" class="hidden">
      <div id="scope" class="hidden"><div class="scope-cross"></div></div>
      <div id="sgnape-fx"></div>
      <div id="damage-flash"></div>
      <div id="dmg-dirs"></div>
      <div id="crosshair"><i></i><i></i><i></i><i></i><b></b></div>
      <div id="hitmarker"></div>
      <div id="plumis"></div>
      <!-- The HUD's panels. On a desktop the wrappers are invisible to layout; on touch they gather the panels in the area the controls leave free. -->
      <div id="hud-free">
      <div id="turret-prompt" class="hidden"></div>
      <div id="turret-hud" class="hidden"><span id="turret-label"></span><div class="bar"><i id="turret-heat"></i></div></div>

      <div id="topbar">
        <div class="score ben"><span class="team-name" id="name-ben"></span><b id="score-ben">0</b></div>
        <div class="center-info">
          <div id="clock">10:00</div>
          <div id="mode-label"></div>
          <div id="objective"></div>
        </div>
        <div class="score mal"><b id="score-mal">0</b><span class="team-name" id="name-mal"></span></div>
      </div>

      <div id="killfeed"></div>
      <div id="announce"></div>
      <div id="banner"></div>

      <div id="hud-status">
      <div id="vitals">
        <div class="vital hp"><span class="ico">🧀</span><b id="hp">100</b><div class="bar"><i id="hp-bar"></i></div></div>
        <div class="vital armor"><span class="ico">🥮</span><b id="armor">0</b><div class="bar"><i id="armor-bar"></i></div></div>
        <div id="buffs"></div>
      </div>

      <div id="ammo">
        <div id="weapon-name"></div>
        <div class="ammo-row"><b id="mag">30</b><span>/</span><span id="reserve">150</span></div>
        <div id="bombs"></div>
        <div id="slots"></div>
      </div>
      </div>

      <div id="chat"><div id="chat-log"></div><input id="chat-input" class="hidden" maxlength="120" data-t-ph="chatPh" /></div>
      </div>
      <div id="quickchat" class="hidden"></div>

      <div id="death" class="hidden">
        <div class="death-title" data-t="deathTitle"></div>
        <div id="death-by"></div>
        <div id="death-line"></div>
        <div id="death-timer"></div>
        <div class="death-hint" data-t="deathHint"></div>
      </div>

      <div id="board" class="hidden"></div>
      <!-- The in-match menus: UI SDK dialogs whose content opens in the top layer. client/game.ts draws them, opens
           them and steps back through them on Esc; Tab stays inside the open one. -->
      <ui-dialog id="loadout-dialog" class="match-dialog" modal="trap-focus" dismissible="false"><ui-dialog-content id="loadout" class="overlay" final-focus="none" hidden><ui-dialog-title></ui-dialog-title><div class="overlay-main"></div></ui-dialog-content></ui-dialog>
      <ui-dialog id="pause-dialog" class="match-dialog" modal="trap-focus" dismissible="false"><ui-dialog-content id="pause" class="overlay" final-focus="none" hidden><ui-dialog-title></ui-dialog-title><div class="overlay-main"></div></ui-dialog-content></ui-dialog>
      <ui-dialog id="settings-dialog" class="match-dialog" modal="trap-focus" dismissible="false"><ui-dialog-content id="settings-ingame" class="overlay" final-focus="none" hidden><ui-dialog-title></ui-dialog-title><div class="overlay-main"></div></ui-dialog-content></ui-dialog>
      <ui-dialog id="end-dialog" class="match-dialog" modal="trap-focus" dismissible="false"><ui-dialog-content id="endscreen" class="overlay" final-focus="none" hidden><ui-dialog-title></ui-dialog-title><div class="overlay-main"></div></ui-dialog-content></ui-dialog>
      <div id="clickplay" class="hidden"></div>

      <!-- Touch controls: drawn where client/touch.ts places them; the canvas below takes the fingers. No text chat on touch. -->
      <div id="touch" class="hidden" aria-hidden="true">
        <div id="touch-stick"><i id="touch-knob"></i></div>
        <div id="touch-fire"></div>
        <div id="touch-fire-left"></div>
        <div class="touch-btn" id="touch-aim">◎</div>
        <div class="touch-btn" id="touch-crouch">▼</div>
        <div class="touch-btn" id="touch-jump">▲</div>
        <div class="touch-btn" id="touch-reload">↻</div>
        <div class="touch-btn" id="touch-bomb">🍶</div>
        <div class="touch-btn" id="touch-mine">💣</div>
        <div class="touch-btn hidden" id="touch-use"></div>
        <div class="touch-btn" id="touch-menu">☰</div>
        <div class="touch-btn" id="touch-board">🏆</div>
        <div class="touch-btn" id="touch-phrases">💬</div>
        <div id="touch-weapon"></div>
        <div id="touch-picker" class="hidden"></div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
    <!-- Resolves the safe-area insets (notch, home indicator) for the touch layout. -->
    <div id="safe-area" aria-hidden="true"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
